name: Auto-translate

on:
  schedule:
    - cron: '0 6 * * *'   # 6am UTC daily
  workflow_dispatch:       # also triggerable manually from the GitHub Actions tab

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Run translation script
        run: npm run translate
        env:
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}

      - name: Commit updated locale files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/locales/
          git diff --staged --quiet && echo "Nothing new to commit." || \
            git commit -m "chore: update translations [skip ci]" && git push
