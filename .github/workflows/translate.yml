name: Auto-translate

on:
  schedule:
    - cron: '0 6 * * *'   # 6am UTC daily
  workflow_dispatch:       # also triggerable manually from the GitHub Actions tab

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Run translation script
        run: npm run translate
        env:
          MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}

      - name: Show translation progress
        run: |
          echo "=== Translation progress ==="
          total=$(jq '[.[] | length] | max // "?"' public/locales/.hashes.json 2>/dev/null || echo "?")
          found=0
          for f in public/locales/*.json; do
            [ -f "$f" ] || continue
            [[ "$f" == *".hashes.json" ]] && continue
            found=1
            lang=$(basename "$f" .json)
            done=$(jq 'length' "$f")
            echo "$lang: $done / $total strings translated"
          done
          [ $found -eq 0 ] && echo "(no locale files yet)"
        continue-on-error: true

      - name: Commit updated locale files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/locales/
          if git diff --staged --quiet; then
            echo "No new translations to commit."
          else
            git commit -m "chore: update translations [skip ci]"
            git push
          fi
