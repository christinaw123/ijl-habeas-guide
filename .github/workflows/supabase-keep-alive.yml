name: Supabase keep-alive

on:
  schedule:
    - cron: '0 12 */6 * *'  # every 6 days at noon UTC (well under the 7-day auto-pause threshold)
  workflow_dispatch:          # also triggerable manually from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/facilities?select=facility_code&limit=1" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}")
          echo "HTTP $status"
          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo "Ping failed — check that NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY are set in repository secrets."
            exit 1
          fi
          echo "Supabase project is active."
